<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>MOMENT</title>
<style>
:root{--cream:#f8f6f0;--sage:#aabda9;--sage2:#eef3ea;--pink:#efd0d4;--lav:#d9d3e8;--ink:#353633;--muted:#777970;--card:#fffefa;--line:#00000012}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;color:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:94px}.screen{padding:22px 18px 20px}h1{font-size:32px;line-height:1.08;margin:4px 0 5px}h2{font-size:23px;margin:0 0 12px}.sub{color:var(--muted)}.small{font-size:13px;color:var(--muted)}
.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 5px 22px #00000008}.free{background:linear-gradient(135deg,#eef3ea,#f8f5ef);padding:22px;border-radius:24px;margin:20px 0}.free strong{font-size:27px;display:block;margin-bottom:3px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 11px;border-radius:999px;background:#f0eee8;font-size:12px}.empty{padding:30px 12px;text-align:center;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fffefbf2;backdrop-filter:blur(16px);border-top:1px solid #0000000a;display:flex;justify-content:center;z-index:10}.nav-inner{max-width:520px;width:100%;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.nav button{background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;gap:3px;align-items:center}.nav button.active{color:#526c59;font-weight:600}.fab{position:fixed;right:max(20px,calc((100vw - 520px)/2 + 20px));bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--sage);font-size:28px;color:white;box-shadow:0 8px 22px #0002;z-index:9}
.field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:white;margin:6px 0 12px}.primary{width:100%;padding:14px;border-radius:16px;background:var(--sage);color:white;font-weight:700}.secondary{padding:11px 14px;border-radius:14px;background:#f0eee8}.danger{padding:9px 11px;border-radius:12px;background:#f7e6e7;color:#8b555b}.onboarding{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px}.logo{font-size:42px;font-weight:700;letter-spacing:1px}.tag{font-size:18px;color:var(--muted);line-height:1.35;margin:8px 0 28px}.modal{position:fixed;inset:0;background:#0005;display:flex;align-items:end;z-index:20}.sheet{width:100%;max-width:520px;margin:auto;background:var(--cream);border-radius:26px 26px 0 0;padding:22px 18px calc(25px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.timeline{margin-top:10px}.tl{display:flex;gap:10px;align-items:stretch;margin:9px 0}.tl-time{width:54px;font-size:12px;color:var(--muted);padding-top:10px}.tl-card{flex:1;background:var(--card);border-radius:16px;padding:11px 13px;border-left:4px solid var(--sage);box-shadow:0 3px 14px #00000006}.tl-card.work{border-left-color:#8d9aa8}.tl-card.commute{border-left-color:#d2bd8c}.tl-card.flex{border-left-color:#cdbedc}.freeblock{margin:9px 0 9px 64px;padding:10px 13px;border-radius:14px;background:#eef3ea;color:#526c59;font-size:13px}.badge-fixed{background:#eee9e2}.badge-flex{background:#eee9f4}.badge-protected{background:#e9eef1}
</style>
</head>
<body><div id="root"></div>
<script>
const KEY="moment_state_v1";
const blank={onboarding:false,name:"",wake:"",bed:"",morning:30,evening:30,workStart:"",workEnd:"",commute:0,events:[],tasks:[],active:"today"};
let state=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(blank);
state.events=state.events||[]; state.tasks=state.tasks||[];
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=d=>new Date(d).toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"});
const toMin=t=>{if(!t||!t.includes(":"))return 0;const [h,m]=t.split(":").map(Number);return h*60+m};
const time=m=>{m=Math.max(0,Math.round(m));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
function intervalsToday(){
 const arr=[];
 const wake=toMin(state.wake), bed=toMin(state.bed); const dayEnd=bed>wake?bed:bed+1440;
 if(state.workStart&&state.workEnd){let s=toMin(state.workStart),e=toMin(state.workEnd);if(e<=s)e+=1440;arr.push({s,e,label:"💼 Arbeit",type:"work",fixed:true})}
 if(Number(state.commute)>0&&state.workStart&&state.workEnd){let s=toMin(state.workStart)-Number(state.commute),e=toMin(state.workStart);arr.push({s,e,label:"🚗 Hinweg",type:"commute",fixed:true});let ws=toMin(state.workEnd);arr.push({s:ws,e:ws+Number(state.commute),label:"🚗 Heimweg",type:"commute",fixed:true})}
 state.events.filter(e=>e.date===todayKey()).forEach(e=>{let s=toMin(e.start),end=s+Number(e.duration||30);arr.push({s,e:end,label:"📅 "+e.title,type:e.fixed?'fixed':'flex',fixed:e.fixed!==false,id:e.id,kind:"event",duration:Number(e.duration||30)})});
 state.tasks.filter(t=>t.date===todayKey()&&!t.done).forEach(t=>{let s=t.start?toMin(t.start):null;if(s!==null)arr.push({s,e:s+Number(t.duration||30),label:"☑️ "+t.title,type:t.fixed?'fixed':'flex',fixed:t.fixed!==false,id:t.id,kind:"task",duration:Number(t.duration||30)});});
 return {arr,wake,bed:dayEnd};
}
function freeMinutes(){
 const {arr,wake,bed}=intervalsToday(); if(!state.wake||!state.bed)return 0;
 const usable=[]; const morning=Number(state.morning)||0, evening=Number(state.evening)||0; let start=wake+morning,end=bed-evening; const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes(); if(nowMin>start) start=Math.min(nowMin,end);
 if(end<=start)return 0; arr.forEach(x=>{let s=Math.max(start,x.s),e=Math.min(end,x.e);if(e>s)usable.push([s,e])}); usable.sort((a,b)=>a[0]-b[0]); let used=0,cs=null,ce=null; usable.forEach(([s,e])=>{if(cs===null){cs=s;ce=e}else if(s<=ce){ce=Math.max(ce,e)}else{used+=ce-cs;cs=s;ce=e}});if(cs!==null)used+=ce-cs;return Math.max(0,(end-start)-used);
}
function greeting(){let h=new Date().getHours();return h<12?"Guten Morgen":h<18?"Guten Tag":"Guten Abend"}
function nav(){return `<div class="nav"><div class="nav-inner">${[["today","🏠","Heute"],["calendar","📅","Kalender"],["tasks","☑️","Aufgaben"],["work","💼","Arbeit"],["life","❤️","Leben"]].map(x=>`<button class="${state.active===x[0]?"active":""}" onclick="go('${x[0]}')"><span style="font-size:20px">${x[1]}</span>${x[2]}</button>`).join("")}</div></div><button class="fab" onclick="addMenu()">+</button>`}
function onboarding(){document.getElementById("root").innerHTML=`<div class="onboarding"><div class="logo">MOMENT</div><div class="tag">Mehr als ein Plan.<br>Dein Leben.</div><div class="card"><h2>Willkommen 🤍</h2><p class="sub">Richte deinen Alltag einmal ein. Alles bleibt später veränderbar.</p><input id="name" class="field" placeholder="Wie heißt du?" value="${esc(state.name)}"><label class="small">Aufstehen</label><input id="wake" class="field" type="time" value="${state.wake}"><label class="small">Schlafenszeit</label><input id="bed" class="field" type="time" value="${state.bed}"><label class="small">Arbeitsbeginn</label><input id="ws" class="field" type="time" value="${state.workStart}"><label class="small">Arbeitsende</label><input id="we" class="field" type="time" value="${state.workEnd}"><label class="small">Arbeitsweg in Minuten</label><input id="commute" class="field" type="number" min="0" value="${state.commute||0}"><button class="primary" onclick="finishOnboarding()">MOMENT starten</button></div></div>`}
function timelineHTML(){const {arr,wake,bed}=intervalsToday();let items=arr.filter(x=>x.e>x.s&&x.s<bed&&x.e>wake).sort((a,b)=>a.s-b.s);let html="",cursor=wake+Number(state.morning||0);items.forEach(x=>{let s=Math.max(x.s,wake),e=Math.min(x.e,bed);if(s>cursor)html+=`<div class="freeblock">🤍 ${time(cursor)}–${time(s)} · freie Zeit</div>`;html+=`<div class="tl"><div class="tl-time">${time(s)}</div><div class="tl-card ${x.type}"><div class="row"><b>${esc(x.label)}</b><span class="pill ${x.fixed?'badge-fixed':'badge-flex'}">${x.fixed?'Fix':'Flexibel'}</span></div><div class="small">${Math.max(0,e-s)} Min.</div></div></div>`;cursor=Math.max(cursor,e)});let end=bed-Number(state.evening||0);if(end>cursor)html+=`<div class="freeblock">🤍 ${time(cursor)}–${time(end)} · freie Zeit</div>`;return html||`<div class="empty">Noch keine Zeitblöcke. 🤍</div>`}
function today(){let f=freeMinutes();document.getElementById("root").innerHTML=`<div class="app"><main class="screen"><h1>${greeting()}${state.name?", "+esc(state.name):""} 🤍</h1><div class="sub">${fmtDate(new Date())}</div><div class="free"><strong>🤍 ${Math.floor(f/60)} Std. ${f%60} Min.</strong><span>freie Zeit heute</span></div><div class="row"><h2>Heute</h2><button class="pill" onclick="lessToday()">🌿 Heute weniger</button></div><div class="timeline">${timelineHTML()}</div></main>${nav()}</div>`}
function calendar(){let ev=[...state.events].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));document.getElementById("root").innerHTML=`<div class="app"><main class="screen"><h1>Kalender</h1><div class="sub">Dein MOMENT-Kalender</div><div class="card"><h2>${fmtDate(new Date())}</h2><p class="sub">Termine erscheinen hier und automatisch auch in „Heute“.</p></div>${ev.map(e=>`<div class="card"><div class="row"><div><b>${esc(e.title)}</b><div class="small">${e.date} · ${e.start} · ${e.duration} Min. · ${e.fixed===false?'Flexibel':'Fix'}</div></div><button class="danger" onclick="deleteEvent('${e.id}')">Löschen</button></div></div>`).join("")||`<div class="empty">Dein Kalender ist noch leer. 🤍</div>`}</main>${nav()}</div>`}
function tasks(){document.getElementById("root").innerHTML=`<div class="app"><main class="screen"><h1>Aufgaben</h1><div class="sub">Alles, was du erledigen möchtest.</div>${state.tasks.map(t=>`<div class="card"><div class="row"><div><b>${esc(t.title)}</b><div class="small">${t.date} · ${t.duration} Min. · ${t.fixed===false?'Flexibel':'Fix'}${t.start?' · '+t.start:''}</div></div><div class="actions"><button class="secondary" onclick="doneTask('${t.id}')">${t.done?'↩':'✓'}</button><button class="danger" onclick="deleteTask('${t.id}')">Löschen</button></div></div></div>`).join("")||`<div class="empty">Noch keine Aufgaben. 🤍</div>`}</main>${nav()}</div>`}
function work(){document.getElementById("root").innerHTML=`<div class="app"><main class="screen"><h1>💼 Arbeit</h1><div class="sub">Deine Arbeitswelt bleibt getrennt – und erscheint trotzdem in Heute.</div><div class="card"><div class="row"><b>Arbeitszeit</b><span class="pill">${state.workStart}–${state.workEnd}</span></div><p class="small">Arbeitsweg: ${state.commute} Min. hin + ${state.commute} Min. zurück</p></div><div class="card"><b>Was MOMENT heute berücksichtigt</b><p class="small">Arbeitszeit, Arbeitswege und weitere fixe Termine werden bei der freien Zeit berücksichtigt.</p></div></main>${nav()}</div>`}
function life(){document.getElementById("root").innerHTML=`<div class="app"><main class="screen"><h1>❤️ Leben</h1><div class="sub">Zeit für das, was außerhalb der Arbeit wichtig ist.</div>${["❤️ Beziehung","🏃 Sport","👨‍👩‍👧 Freunde & Familie","🏠 Haushalt","🧘 Me-Time","🍽️ Essen"].map(x=>`<div class="card"><b>${x}</b><div class="small">Über ➕ kannst du Zeit dafür einplanen.</div></div>`).join("")}</main>${nav()}</div>`}
function go(x){state.active=x;save()}
function addMenu(){document.getElementById("root").insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="sheet"><div class="row"><h2>Was möchtest du hinzufügen?</h2><button class="secondary" onclick="closeModal()">✕</button></div><div class="actions">${["📅 Termin","☑️ Aufgabe","🏃 Sport","❤️ Beziehung","👨‍👩‍👧 Freunde & Familie","🏠 Haushalt","🧘 Me-Time","🍽️ Essen"].map(x=>`<button class="secondary" onclick="addForm('${x}')">${x}</button>`).join("")}</div></div></div>`)}
function closeModal(){document.getElementById("modal")?.remove()}
function addForm(type){let isTask=type.includes("Aufgabe");document.querySelector("#modal .sheet").innerHTML=`<div class="row"><h2>${type}</h2><button class="secondary" onclick="closeModal()">✕</button></div><input id="title" class="field" placeholder="Titel"><label class="small">Datum</label><input id="date" class="field" type="date" value="${todayKey()}">${isTask?`<label class="small">Startzeit (optional)</label><input id="start" class="field" type="time"><label class="small">Dauer in Minuten</label>`:`<label class="small">Start</label><input id="start" class="field" type="time" value="18:00"><label class="small">Dauer in Minuten</label>`}<input id="duration" class="field" type="number" value="30" min="5" step="5"><label class="small">Planung</label><select id="fixed" class="field"><option value="true">🔒 Fix</option><option value="false">🌿 Flexibel</option></select><button class="primary" onclick="${isTask?'saveTask()':'saveEvent(\''+esc(type)+'\')'}">Speichern</button>`}
function saveEvent(type){let title=document.getElementById("title").value.trim();if(!title)return;const date=document.getElementById("date").value,start=document.getElementById("start").value,duration=Number(document.getElementById("duration").value)||30,fixed=document.getElementById("fixed").value==="true";if(conflict(date,start,duration)){if(!confirm("Diese Zeit überschneidet sich mit einem anderen Eintrag. Trotzdem speichern?"))return}state.events.push({id:crypto.randomUUID(),title,date,start,duration,fixed,area:type.replace(/^[^ ]+ /,"")});save();closeModal()}
function saveTask(){let title=document.getElementById("title").value.trim();if(!title)return;const date=document.getElementById("date").value,start=document.getElementById("start").value,duration=Number(document.getElementById("duration").value)||30,fixed=document.getElementById("fixed").value==="true";if(start&&conflict(date,start,duration)){if(!confirm("Diese Zeit überschneidet sich mit einem anderen Eintrag. Trotzdem speichern?"))return}state.tasks.push({id:crypto.randomUUID(),title,date,start,duration,fixed,done:false});save();closeModal()}
function conflict(date,start,duration){if(date!==todayKey())return false;const s=toMin(start),e=s+duration;return intervalsToday().arr.some(x=>x.e>s&&x.s<e)}
function doneTask(id){let t=state.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save()}
function deleteTask(id){if(confirm("Aufgabe löschen?")){state.tasks=state.tasks.filter(x=>x.id!==id);save()}}
function deleteEvent(id){if(confirm("Termin löschen?")){state.events=state.events.filter(x=>x.id!==id);save()}}
function lessToday(){const flex=state.tasks.filter(t=>t.date===todayKey()&&!t.done&&t.fixed===false);if(!flex.length){alert("🌿 Heute ist alles, was MOMENT kennt, bereits fix – oder es gibt noch keine flexible Aufgabe. 🤍");return}const mins=flex.reduce((n,t)=>n+Number(t.duration||0),0);const names=flex.map(t=>`${t.title} – ${t.duration} Min.`).join("\n");if(confirm(`Dein Tag ist heute ziemlich voll.\n\nFlexible Aufgaben könnten verschoben werden:\n${names}\n\nDadurch würdest du bis zu ${mins} Min. Zeit freibekommen.\n\nMöchtest du diese Aufgaben auf morgen verschieben?`)){const d=new Date();d.setDate(d.getDate()+1);const tomorrow=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");flex.forEach(t=>t.date=tomorrow);save()}}
function finishOnboarding(){state.name=document.getElementById("name").value.trim();state.wake=document.getElementById("wake").value;state.bed=document.getElementById("bed").value;state.workStart=document.getElementById("ws").value;state.workEnd=document.getElementById("we").value;state.commute=Number(document.getElementById("commute").value)||0;if(!state.name||!state.wake||!state.bed||!state.workStart||!state.workEnd){alert("Bitte fülle die Angaben aus. 🤍");return}state.onboarding=true;state.active="today";save()}
function render(){state.onboarding?({today,calendar,tasks,work,life}[state.active]||today)():onboarding()}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});render();
</script></body></html>
